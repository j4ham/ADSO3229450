<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ejemplos de Sombras</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================
         TÍTULO PRINCIPAL
    ====================================== -->

    <h1 class="page-title">
        Ejemplos de Outer Shadow & Inner Shadow
    </h1>



    <div class="gallery">


        <!-- =====================================
             EJEMPLO 1
        ====================================== -->

        <div class="form-container classic-shadow">


            <!-- IMAGEN CON DROP-SHADOW -->

            <img
                src="/imagenes/image.png"
                alt="Imagen principal"
                class="form-image"
            >


            <!-- NUEVA IMAGEN CON BOX-SHADOW + INSET -->

            <div class="image-box">

                <img
                    src="/imagenes/image.png"
                    alt="Segunda imagen"
                    class="form-image-2"
                >

            </div>


            <h2>
                Ejemplo 1: Clásico
            </h2>


            <p class="desc">

                Formulario con
                <strong>Outer Shadow</strong>.

                Los campos tienen
                <strong>Inner Shadow</strong>.

            </p>


            <form>


                <input
                    type="text"
                    placeholder="Usuario"
                    required
                >


                <input
                    type="password"
                    placeholder="Contraseña"
                    required
                >


                <button type="button">
                    Ingresar
                </button>


            </form>

        </div>



        <!-- =====================================
             EJEMPLO 2
        ====================================== -->

        <div class="form-container neumorphism-light">


            <!-- IMAGEN CON DROP-SHADOW -->

            <img
                src="/imagenes/image.png"
                alt="Imagen principal"
                class="form-image"
            >


            <!-- NUEVA IMAGEN CON BOX-SHADOW + INSET -->

            <div class="image-box">

                <img
                    src="/imagenes/image.png"
                    alt="Segunda imagen"
                    class="form-image-2"
                >

            </div>


            <h2>
                Ejemplo 2: Neumorfismo
            </h2>


            <p class="desc">

                Efecto Soft UI.

                El contenedor sale y
                los campos se hunden.

            </p>


            <form>


                <input
                    type="text"
                    placeholder="Usuario"
                    required
                >


                <input
                    type="password"
                    placeholder="Contraseña"
                    required
                >


                <button type="button">
                    Ingresar
                </button>


            </form>

        </div>



        <!-- =====================================
             EJEMPLO 3
        ====================================== -->

        <div class="form-container neumorphism-dark">


            <!-- IMAGEN CON DROP-SHADOW -->

            <img
                src="/imagenes/image.png"
                alt="Imagen principal"
                class="form-image"
            >


            <!-- NUEVA IMAGEN CON BOX-SHADOW + INSET -->

            <div class="image-box">

                <img
                    src="/imagenes/image.png"
                    alt="Segunda imagen"
                    class="form-image-2"
                >

            </div>


            <h2>
                Ejemplo 3: Modo Oscuro
            </h2>


            <p class="desc">

                Neumorfismo oscuro utilizando
                luces y sombras.

            </p>


            <form>


                <input
                    type="text"
                    placeholder="Usuario"
                    required
                >


                <input
                    type="password"
                    placeholder="Contraseña"
                    required
                >


                <button type="button">
                    Ingresar
                </button>


            </form>

        </div>


    </div>


</body>

</html>
