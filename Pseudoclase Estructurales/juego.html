<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Selector Quest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 700px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; text-align: center; }
    .level-badge { background: #334155; color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-bottom: 12px; }
    .instructions { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px; margin-bottom: 20px; border-radius: 4px; line-height: 1.4; }
    .board-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 8px; }
    .game-board { background: #0f172a; border: 2px dashed #334155; border-radius: 8px; padding: 20px; min-height: 160px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin-bottom: 20px; }
    .item { width: 70px; height: 70px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #334155; color: #f8fafc; font-weight: bold; font-size: 0.85rem; border: 2px solid #475569; transition: all 0.3s ease; position: relative; }
    .item span { font-size: 0.65rem; color: #94a3b8; }
    .item.item-p { border-radius: 50%; background: #1e3a8a; border-color: #3b82f6; }
    .item.highlighted { background: #eab308 !important; color: #0f172a !important; border-color: #fef08a !important; transform: scale(1.1); box-shadow: 0 0 15px #eab308; }
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 1rem; font-family: monospace; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { padding: 10px 18px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .quick-btn { background: #334155; font-size: 0.8rem; padding: 6px 10px; margin: 2px; }
    .quick-btn:hover { background: #475569; }
    .feedback { text-align: center; font-weight: bold; margin-top: 10px; min-height: 24px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .next-btn { width: 100%; margin-top: 15px; background: #16a34a; }
    .next-btn:hover { background: #15803d; }
  </style>
</head>
<body>

<div class="card">
  <h1>CSS Selector Quest</h1>
  <div style="text-align: center;">
    <span class="level-badge" id="level-badge">Nivel 1 de 6</span>
  </div>
  
  <div class="instructions" id="instructions">Cargando...</div>

  <div class="board-title">Contenedor (#contenedor)</div>
  <div class="game-board" id="game-board"></div>

  <div class="input-group">
    <input type="text" id="selector-input" placeholder="Escribe tu selector CSS aquí..." autocomplete="off">
    <button onclick="checkAnswer()">Probar</button>
  </div>

  <div style="margin-bottom: 15px;">
    <span style="font-size: 0.8rem; color: #94a3b8;">Atajos rápidos:</span><br>
    <button class="quick-btn" onclick="setSelector(':first-child')">:first-child</button>
    <button class="quick-btn" onclick="setSelector(':last-child')">:last-child</button>
    <button class="quick-btn" onclick="setSelector(':nth-child(even)')">:nth-child(even)</button>
    <button class="quick-btn" onclick="setSelector(':nth-child(odd)')">:nth-child(odd)</button>
    <button class="quick-btn" onclick="setSelector('p:nth-of-type(2)')">p:nth-of-type(2)</button>
    <button class="quick-btn" onclick="setSelector(':only-child')">:only-child</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" style="display: none;" onclick="nextLevel()">¡Siguiente Nivel!</button>
</div>

<script>
  const levels = [
    {
      id: 1,
      title: "Selecciona el PRIMER elemento del contenedor.",
      hint: "Aplica la pseudoclase :first-child",
      targetSelector: ":first-child",
      elements: [{ type: "div", label: "div #1" }, { type: "div", label: "div #2" }, { type: "div", label: "div #3" }, { type: "div", label: "div #4" }]
    },
    {
      id: 2,
      title: "Selecciona el ÚLTIMO elemento del contenedor.",
      hint: "Aplica la pseudoclase :last-child",
      targetSelector: ":last-child",
      elements: [{ type: "div", label: "div #1" }, { type: "div", label: "div #2" }, { type: "div", label: "div #3" }, { type: "div", label: "div #4" }]
    },
    {
      id: 3,
      title: "Selecciona todos los elementos en posiciones PARES (2 y 4).",
      hint: "Usa :nth-child con el valor 'even'",
      targetSelector: ":nth-child(even)",
      elements: [{ type: "div", label: "div #1" }, { type: "div", label: "div #2" }, { type: "div", label: "div #3" }, { type: "div", label: "div #4" }]
    },
    {
      id: 4,
      title: "Selecciona todos los elementos en posiciones IMPARES (1, 3 y 5).",
      hint: "Usa :nth-child con el valor 'odd'",
      targetSelector: ":nth-child(odd)",
      elements: [{ type: "div", label: "div #1" }, { type: "div", label: "div #2" }, { type: "div", label: "div #3" }, { type: "div", label: "div #4" }, { type: "div", label: "div #5" }]
    },
    {
      id: 5,
      title: "Selecciona únicamente el SEGUNDO elemento de tipo <p>.",
      hint: "Ignora las etiquetas <div> y usa p:nth-of-type(2)",
      targetSelector: "p:nth-of-type(2)",
      elements: [{ type: "div", label: "div" }, { type: "p", label: "p #1" }, { type: "div", label: "div" }, { type: "p", label: "p #2" }]
    },
    {
      id: 6,
      title: "Selecciona el elemento que sea HIJO ÚNICO en su contenedor.",
      hint: "Busca la etiqueta que no tenga hermanos con :only-child",
      targetSelector: ":only-child",
      elements: [
        { type: "div", label: "Padre A", children: [{ type: "div", label: "div 1" }, { type: "div", label: "div 2" }] },
        { type: "div", label: "Padre B", children: [{ type: "div", label: "Único!" }] }
      ]
    }
  ];

  let currentLevelIdx = 0;

  function loadLevel(idx) {
    const level = levels[idx];
    document.getElementById("level-badge").innerText = `Nivel ${idx + 1} de ${levels.length}`;
    document.getElementById("instructions").innerHTML = `<strong>Objetivo:</strong> ${level.title}<br><small style="color: #94a3b8;">PISTA: ${level.hint}</small>`;
    document.getElementById("feedback").innerText = "";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("selector-input").value = "";

    const board = document.getElementById("game-board");
    board.innerHTML = "";

    if (level.id === 6) {
      level.elements.forEach(subGroup => {
        const subBox = document.createElement("div");
        subBox.style.cssText = "border: 1px dashed #475569; padding: 10px; border-radius: 6px; display: flex; gap: 8px;";
        subGroup.children.forEach(el => {
          const elem = document.createElement(el.type);
          elem.className = "item";
          elem.innerHTML = `${el.label}<span>&lt;${el.type}&gt;</span>`;
          subBox.appendChild(elem);
        });
        board.appendChild(subBox);
      });
    } else {
      level.elements.forEach(el => {
        const elem = document.createElement(el.type);
        elem.className = `item ${el.type === 'p' ? 'item-p' : ''}`;
        elem.innerHTML = `${el.label}<span>&lt;${el.type}&gt;</span>`;
        board.appendChild(elem);
      });
    }
  }

  function setSelector(val) {
    document.getElementById("selector-input").value = val;
    checkAnswer();
  }

  function checkAnswer() {
    const userInput = document.getElementById("selector-input").value.trim();
    const feedback = document.getElementById("feedback");
    const board = document.getElementById("game-board");
    
    document.querySelectorAll(".item").forEach(el => el.classList.remove("highlighted"));

    if (!userInput) {
      feedback.innerText = "Escribe un selector para evaluar.";
      feedback.className = "feedback error";
      return;
    }

    try {
      const matches = board.querySelectorAll(userInput);
      matches.forEach(el => {
        if (el.classList.contains("item")) {
          el.classList.add("highlighted");
        }
      });

      const targetMatches = board.querySelectorAll(levels[currentLevelIdx].targetSelector);
      const matchesArr = Array.from(matches).filter(e => e.classList.contains("item"));
      const targetArr = Array.from(targetMatches).filter(e => e.classList.contains("item"));

      const isCorrect = matchesArr.length === targetArr.length && 
                        matchesArr.every((el, index) => el === targetArr[index]);

      if (isCorrect && matchesArr.length > 0) {
        feedback.innerText = "¡Correcto! Has seleccionado los elementos indicados.";
        feedback.className = "feedback success";
        document.getElementById("next-btn").style.display = "block";
      } else {
        feedback.innerText = `Seleccionaste ${matchesArr.length} elemento(s). Revisa tu selector e intenta de nuevo.`;
        feedback.className = "feedback error";
      }
    } catch (e) {
      feedback.innerText = "Selector CSS no válido.";
      feedback.className = "feedback error";
    }
  }

  function nextLevel() {
    currentLevelIdx++;
    if (currentLevelIdx < levels.length) {
      loadLevel(currentLevelIdx);
    } else {
      document.getElementById("level-badge").innerText = "¡Juego Completado!";
      document.getElementById("instructions").innerHTML = "<strong>¡Excelente trabajo!</strong> Has completado todos los niveles practicando pseudoclases de selección.";
      document.getElementById("game-board").innerHTML = "<h2 style='color: #4ade80;'>🎉 ¡Dominas los selectores CSS! 🎉</h2>";
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").style.display = "none";
    }
  }

  loadLevel(0);
</script>

</body>
</html>
